<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WONDERS 月報アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12233F;
  --ink-soft:#3A4557;
  --paper:#EEF0EA;
  --card:#FCFCFA;
  --line:#CDD2C8;
  --gold:#B4841F;
  --green:#2E6B57;
  --rust:#A8442A;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--gothic);font-size:15px;line-height:1.85;font-feature-settings:"palt"}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hidden{display:none}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line);padding:40px 0 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--gold);margin:0 0 10px}
h1{font-family:var(--mincho);font-weight:700;font-size:clamp(25px,5vw,36px);line-height:1.35;margin:0 0 12px;letter-spacing:.02em}
.lede{max-width:60ch;color:var(--ink-soft);margin:0 0 32px;font-size:14px}

/* ---------- mode tabs ---------- */
nav.modes{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.modes-inner{display:flex;gap:2px}
.mode{background:none;border:0;border-bottom:2px solid transparent;padding:14px 18px;font:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:700}
.mode:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}

/* ---------- selectors (signature: 背表紙) ---------- */
.spine{border-bottom:1px solid var(--line);padding:22px 0 20px}
.spine-title{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-soft);margin:0 0 14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:13.5px;padding:7px 15px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:2px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.pill .n{font-family:var(--mono);font-size:11px;opacity:.65;margin-left:7px}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:24px 0 4px}
input[type=search]{flex:1 1 240px;min-width:0;padding:10px 13px;font:inherit;font-size:14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px}
input[type=search]:focus{outline:2px solid var(--gold);outline-offset:-1px}
.ghost{padding:10px 14px;font:inherit;font-size:13px;background:none;border:1px solid var(--line);
  border-radius:2px;color:var(--ink-soft);cursor:pointer}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
main{padding-bottom:80px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;margin:14px 0}
.card > summary{list-style:none;cursor:pointer;padding:20px 22px;display:block}
.card > summary::-webkit-details-marker{display:none}
.card > summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.head{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.name{font-family:var(--mincho);font-weight:700;font-size:21px;letter-spacing:.02em}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--gold);
  color:var(--gold);padding:2px 9px;border-radius:99px}
.biz{color:var(--ink-soft);font-size:13.5px;margin:6px 0 0}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:2px;padding:6px 10px;line-height:1.3}
.kpi b{display:block;font-family:var(--mono);font-size:14px;font-weight:600}
.kpi span{font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em}
.kpi.ok{border-color:var(--green)} .kpi.ok b{color:var(--green)}
.kpi.warn{border-color:var(--rust)} .kpi.warn b{color:var(--rust)}
.more{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;margin-top:14px;display:block}
.card[open] .more::after{content:"閉じる ▲"}
.card:not([open]) .more::after{content:"報告とFBを読む ▼"}
.body{padding:0 22px 24px;border-top:1px solid var(--line);margin-top:4px}
.block{padding-top:20px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--gold);margin:0 0 8px}
.block p{margin:0 0 8px}
.block ul{margin:0;padding-left:1.15em}
.block li{margin-bottom:7px}
.fb{background:#F4F5F0;border-left:3px solid var(--ink);padding:18px 20px;margin-top:20px}
.fb .label{color:var(--ink)}
.note{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.empty{border:1px dashed var(--line);padding:28px 22px;color:var(--ink-soft);font-size:14px;margin-top:14px}

/* ---------- person timeline ---------- */
.person-head{padding:26px 0 6px}
.person-head h2{font-family:var(--mincho);font-size:26px;margin:0 0 4px;font-weight:700}
.person-head p{margin:0;color:var(--ink-soft);font-size:13.5px}
.timeline{border-left:1px solid var(--line);margin-left:7px;padding-left:22px;margin-top:18px}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-27px;top:22px;width:11px;height:11px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--paper)}
.tl-month{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-soft);padding-top:14px}

/* ---------- extras (themes / bench) ---------- */
.fold{border-top:1px solid var(--line);margin-top:36px}
.fold > summary{list-style:none;cursor:pointer;padding:20px 0;font-family:var(--mincho);
  font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"開く ▼";font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em}
.fold[open] > summary::after{content:"閉じる ▲"}
.theme{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:44px 1fr;gap:0 18px}
.theme-no{font-family:var(--mono);font-size:20px;color:var(--gold);line-height:1.4}
.theme h3{font-family:var(--mincho);font-size:17px;margin:0 0 6px;font-weight:700}
.theme p{margin:0 0 8px}
.who{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
.bench{width:100%;border-collapse:collapse;font-size:14px}
.bench th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
  font-weight:400;border-bottom:1px solid var(--ink);padding:8px 12px 8px 0}
.bench td{border-bottom:1px solid var(--line);padding:14px 12px 14px 0;vertical-align:top}
.bench td:first-child{white-space:nowrap;font-size:12.5px;color:var(--gold);font-family:var(--mono)}
footer{border-top:1px solid var(--line);padding:24px 0 60px;font-size:12px;color:var(--ink-soft)}

@media(max-width:720px){
  .bench td:first-child{white-space:normal}
  .theme{grid-template-columns:1fr}
  .theme-no{font-size:14px}
  .timeline{padding-left:16px}
}
@media(prefers-reduced-motion:no-preference){
  .card[open] .body{animation:reveal .22s ease-out}
  @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<header class="wrap">
  <p class="eyebrow">WONDERS / MONTHLY REPORT</p>
  <h1>月報アーカイブ</h1>
  <p class="lede">メンバーの月報と、ひらちさんからのフィードバックを保管しています。月でまとめて読むか、一人分を時系列で追うかを切り替えられます。</p>
</header>

<nav class="modes">
  <div class="wrap modes-inner" role="tablist">
    <button class="mode" role="tab" aria-selected="true"  data-mode="month">月で見る</button>
    <button class="mode" role="tab" aria-selected="false" data-mode="person">人で見る</button>
  </div>
</nav>

<div class="wrap spine">
  <p class="spine-title" id="spineTitle">月を選ぶ</p>
  <div class="pills" id="spine"></div>
</div>

<main class="wrap">
  <div class="toolbar">
    <input type="search" id="q" placeholder="名前・事業・キーワードで絞り込む" aria-label="絞り込み">
    <button class="ghost" id="toggleAll">すべて開く</button>
    <span class="count" id="count"></span>
  </div>
  <div id="view"></div>
</main>

<footer class="wrap"><p>WONDERS 月報アーカイブ</p></footer>

<script>

themes:[

}
];

/* ============================ 以下は変更不要 ============================ */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const PEOPLE = [];
MONTHS.forEach(mo => mo.members.forEach(m => { if(!PEOPLE.includes(m.name)) PEOPLE.push(m.name); }));
const monthCount = name => MONTHS.filter(mo => mo.members.some(m => m.name === name)).length;

let mode = "month";
let curMonth = MONTHS[0].id;
let curPerson = PEOPLE[0];

function cardHTML(m, monthLabel){
  return `
<details class="card">
  <summary>
    <div class="head">
      <span class="name">${esc(m.name)}</span>
      ${monthLabel ? `<span class="tag">${esc(monthLabel)}</span>` : ""}
    </div>
    <p class="biz">${esc(m.biz)}</p>
    <div class="kpis">${(m.kpis||[]).map(k=>`<div class="kpi ${k.s||''}"><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join("")}</div>
    <span class="more"></span>
  </summary>
  <div class="body">
    <div class="block"><p class="label">目標</p><p>${esc(m.goal)}</p></div>
    <div class="block"><p class="label">本人の報告</p>${(m.report||[]).map(t=>`<p>${esc(t)}</p>`).join("")}</div>
    <div class="fb"><p class="label">ひらちさんのフィードバック</p><ul>${(m.fb||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="block"><p class="label">次にやること</p><ul>${(m.next||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
  </div>
</details>`;
}

function monthView(){
  const mo = MONTHS.find(x => x.id === curMonth);
  const themes = (mo.themes||[]).map((t,i)=>`
    <div class="theme"><div class="theme-no">${String(i+1).padStart(2,"0")}</div>
    <div><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p><p class="who">${esc(t[2])}</p></div></div>`).join("");
  const bench = (mo.bench||[]).map(b=>
    `<tr><td>${esc(b[0])}</td><td>${esc(b[1])}</td><td>${esc(b[2])}</td></tr>`).join("");
  return `
    <div id="cardArea">${mo.members.map(m => cardHTML(m, null)).join("")}</div>
    ${themes ? `<details class="fold"><summary>${esc(mo.label)}のFBに共通するテーマ</summary><div>${themes}</div></details>` : ""}
    ${bench ? `<details class="fold"><summary>${esc(mo.label)}に出た基準値</summary>
      <table class="bench"><thead><tr><th>領域</th><th>指標</th><th>基準値・考え方</th></tr></thead>
      <tbody>${bench}</tbody></table></details>` : ""}`;
}

function personView(){
  const entries = MONTHS
    .map(mo => ({mo, m: mo.members.find(x => x.name === curPerson)}))
    .filter(x => x.m);
  const latest = entries[0];
  if(!latest) return `<div class="empty">この人の月報はまだありません。</div>`;
  return `
    <div class="person-head">
      <h2>${esc(curPerson)}</h2>
      <p>${esc(latest.m.biz)}　／　これまでの月報 ${entries.length}件</p>
    </div>
    <div class="timeline" id="cardArea">
      ${entries.map(e => `<div class="tl-item"><p class="tl-month">${esc(e.mo.label)}</p>${cardHTML(e.m, null)}</div>`).join("")}
    </div>`;
}

function renderSpine(){
  const title = document.getElementById("spineTitle");
  const spine = document.getElementById("spine");
  if(mode === "month"){
    title.textContent = "月を選ぶ";
    spine.innerHTML = MONTHS.map(mo =>
      `<button class="pill" data-id="${esc(mo.id)}" aria-pressed="${mo.id===curMonth}">${esc(mo.label)}<span class="n">${mo.members.length}名</span></button>`).join("");
  }else{
    title.textContent = "人を選ぶ";
    spine.innerHTML = PEOPLE.map(p =>
      `<button class="pill" data-id="${esc(p)}" aria-pressed="${p===curPerson}">${esc(p)}<span class="n">${monthCount(p)}件</span></button>`).join("");
  }
}

function render(){
  renderSpine();
  document.getElementById("view").innerHTML = mode === "month" ? monthView() : personView();
  document.getElementById("toggleAll").textContent = "すべて開く";
  filter();
}

function filter(){
  const t = document.getElementById("q").value.trim().toLowerCase();
  const cards = [...document.querySelectorAll("#cardArea .card")];
  let n = 0;
  cards.forEach(c=>{
    const hit = !t || c.textContent.toLowerCase().includes(t);
    const box = c.closest(".tl-item") || c;
    box.classList.toggle("hidden", !hit);
    if(hit) n++;
  });
  const unit = mode === "month" ? "名" : "件";
  document.getElementById("count").textContent = t ? `${n} / ${cards.length}${unit}` : `${cards.length}${unit}`;
}

document.getElementById("q").addEventListener("input", filter);

document.getElementById("toggleAll").addEventListener("click", e=>{
  const open = e.target.textContent === "すべて開く";
  document.querySelectorAll("#cardArea .card").forEach(c => c.open = open);
  e.target.textContent = open ? "すべて閉じる" : "すべて開く";
});

document.getElementById("spine").addEventListener("click", e=>{
  const b = e.target.closest(".pill");
  if(!b) return;
  if(mode === "month") curMonth = b.dataset.id; else curPerson = b.dataset.id;
  render();
});

document.querySelectorAll(".mode").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    mode = btn.dataset.mode;
    document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
    render();
  });
});

render();
</script>
</body>
</html>
